name: EOS v4.1 Enterprise Architecture Audit & Hard Security Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  eos-audit:
    name: EOS Continuous Architecture Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Execute EOS Hard Quality Gate Audit
        run: |
          npx tsx EOS/bin/eos.ts audit

      - name: Verify Report Integrity & Fail-Closed Gate Status
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync(".eos/auditoria.json")) {
              console.error("::error::FAIL-CLOSED BLOCK: .eos/auditoria.json missing!");
              process.exit(1);
            }
            const report = JSON.parse(fs.readFileSync(".eos/auditoria.json"));
            const status = report.overall_phase_status;
            console.log("EOS Overall Phase Status:", status);
            if (status !== "GREEN") {
              console.error(`::error::FAIL-CLOSED BLOCK: Quality Gate Status is "${status}" (expected "GREEN"). Build aborted.`);
              process.exit(1);
            }
            console.log("✅ CI FAIL-CLOSED GATE PASSED: Status is GREEN.");
          '

      - name: Upload Audit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eos-audit-report
          path: .eos/

